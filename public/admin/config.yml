backend:
  name: github
  repo: Waynechin4398/wayneomni
  branch: main
  # Login: GitHub OAuth via Cloudflare Pages Functions (functions/api/auth.js
  # and functions/api/callback.js). Needs GITHUB_CLIENT_ID and
  # GITHUB_CLIENT_SECRET in the Cloudflare Pages project settings.
  base_url: https://wayneomni.com
  auth_endpoint: api/auth
  squash_merges: true
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"
    openAuthoring: "{{message}}"

local_backend: true
publish_mode: editorial_workflow
site_url: https://wayneomni.com
display_url: https://wayneomni.com
logo_url: /images/icon-512.png
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Brand and contact
        file: src/data/site.json
        fields:
          - { label: Public brand, name: brand, widget: string }
          - { label: Legal business name, name: legalName, widget: string }
          - { label: Descriptor, name: descriptor, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Hero title, name: heroTitle, widget: string }
          - { label: Hero introduction, name: heroIntro, widget: text }
          - { label: Location line, name: location, widget: string }
          - { label: Show portfolio (Work pages and case studies), name: showWork, widget: boolean, default: false, required: false }
          - { label: Contact email, name: contactEmail, widget: string, required: false }
          - { label: WhatsApp URL, name: whatsappUrl, widget: string, required: false }
          - { label: Booking URL, name: bookingUrl, widget: string, required: false }
          - { label: SSM number, name: ssmNumber, widget: string, required: false }
          - { label: Business address, name: businessAddress, widget: text, required: false }
          - label: Analytics placeholders
            name: analytics
            widget: object
            fields:
              - { label: GA4 measurement ID, name: ga4, widget: string, required: false }
              - { label: Google Tag Manager ID, name: gtm, widget: string, required: false }
              - { label: Meta Pixel ID, name: metaPixel, widget: string, required: false }
              - { label: LinkedIn partner ID, name: linkedInPartner, widget: string, required: false }
              - { label: TikTok Pixel ID, name: tiktokPixel, widget: string, required: false }

  - name: pageSeo
    label: Page SEO
    files:
      - name: pages
        label: Main pages (titles and meta descriptions)
        file: src/data/pages.json
        description: "Titles get “ — Wayne Omni” added automatically. Aim for titles of 50–60 characters and descriptions of 140–160 characters."
        fields:
          - label: Home page
            name: home
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Leave empty to use the brand title (Wayne Omni — AI Agent Marketing Team, Malaysia)." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }
          - label: About
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }
          - label: AI Agents
            name: aiAgents
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }
          - label: AI Visibility
            name: aiVisibility
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }
          - label: Services overview
            name: services
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }
          - label: Insights (blog index)
            name: insights
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }
          - label: Work
            name: work
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }
          - label: Contact
            name: contact
            widget: object
            collapsed: true
            fields:
              - { label: SEO title, name: title, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
              - { label: Meta description, name: description, widget: text, hint: "Shown under the title in Google results. Aim for 140–160 characters." }

  - name: services
    label: Services
    label_singular: Service
    folder: src/content/services
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{number}} · {{title}}"
    sortable_fields: [order, title, group]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Number, name: number, widget: string }
      - { label: Capability group, name: group, widget: select, options: [Build, Acquire, Engage, Automate] }
      - { label: Short line, name: short, widget: string }
      - { label: Introduction, name: intro, widget: text }
      - { label: Buyer pain points, name: painPoints, widget: list, field: { label: Pain point, name: painPoint, widget: string } }
      - label: Solutions
        name: solutions
        widget: list
        fields:
          - { label: Solution title, name: title, widget: string }
          - { label: Solution description, name: description, widget: text }
      - { label: Best suited for, name: idealFor, widget: list, field: { label: Fit, name: fit, widget: string } }
      - { label: Outcomes, name: outcomes, widget: list, field: { label: Outcome, name: outcome, widget: string } }
      - { label: Deliverables, name: deliverables, widget: list, field: { label: Deliverable, name: deliverable, widget: string } }
      - label: Process
        name: process
        widget: list
        fields:
          - { label: Step title, name: title, widget: string }
          - { label: Step description, name: description, widget: text }
      - label: FAQs
        name: faqs
        widget: list
        fields:
          - { label: Question, name: question, widget: string }
          - { label: Answer, name: answer, widget: text }
      - { label: CTA headline, name: ctaTitle, widget: string }
      - { label: CTA copy, name: ctaCopy, widget: text }
      - { label: Related case-study slugs, name: related, widget: list, field: { label: Slug, name: slug, widget: string } }
      - label: AI agent
        name: agent
        widget: object
        required: false
        fields:
          - { label: Agent name, name: name, widget: string }
          - { label: Summary, name: summary, widget: text }
          - { label: Daily tasks, name: daily, widget: list, field: { label: Task, name: task, widget: string } }
          - { label: What Wayne approves, name: approval, widget: text }
      - { label: Display order, name: order, widget: number, value_type: float }
      - { label: Parent service (platform pages only), name: parent, widget: string, required: false }
      - { label: SEO title, name: seoTitle, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
      - { label: SEO description, name: seoDescription, widget: text, required: false, hint: "Leave empty to use the introduction. Aim for 140–160 characters." }
      - { label: Draft (hide from the live site), name: draft, widget: boolean, default: true }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: taxonomies
    label: Taxonomies
    files:
      - name: industries
        label: Industries
        file: src/data/industries.json
        fields:
          - label: Industries
            name: industries
            widget: list
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Slug, name: slug, widget: string }
              - { label: Publishable, name: publishable, widget: boolean, default: false }

  - name: caseStudies
    label: Case studies
    label_singular: Case study
    folder: src/content/case-studies
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{client}} · {{industry}}"
    fields:
      - { label: Client, name: client, widget: string }
      - { label: Project label, name: label, widget: string }
      - { label: Role, name: role, widget: string, required: false }
      - { label: Project period, name: period, widget: string, required: false }
      - { label: Industry, name: industry, widget: string }
      - { label: Objective, name: objective, widget: string }
      - { label: Services, name: services, widget: list, field: { label: Service, name: service, widget: string } }
      - { label: Tools and platforms, name: tools, widget: list, required: false, field: { label: Tool, name: tool, widget: string } }
      - { label: Summary, name: summary, widget: text }
      - { label: Challenge, name: challenge, widget: text }
      - { label: Strategy, name: strategy, widget: text }
      - { label: What was created, name: created, widget: list, field: { label: Item, name: item, widget: string } }
      - { label: Insight, name: insight, widget: text }
      - { label: Visual palette, name: palette, widget: select, options: [violet, sunset, lime] }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Display order, name: order, widget: number, value_type: int }
      - label: Approved metrics
        name: approvedMetrics
        widget: list
        required: false
        hint: Only add a metric when the evidence and client permission are available.
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Label, name: label, widget: string }
          - { label: Measurement period, name: period, widget: string }
          - { label: Evidence reference, name: evidence, widget: string }
      - { label: Public result context, name: resultContext, widget: text, required: false, hint: Explain the source and measurement limits of any published results. }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: insights
    label: Insights
    label_singular: Insight
    folder: src/content/insights
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} · {{category}}"
    preview_path: "insights/{{slug}}/"
    sortable_fields: [publishDate, title, category]
    view_groups: [{ label: Category, field: category }]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: select, options: [Google Ads, Meta Ads, TikTok Ads, Website Development, Lead Generation] }
      - { label: Excerpt, name: excerpt, widget: text, hint: "One or two sentences shown on the Insights page." }
      - { label: Publish date, name: publishDate, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: Updated date, name: updatedDate, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, required: false, hint: "Set this when you make a meaningful update to the article." }
      - { label: Author name, name: authorName, widget: string, default: Wayne, required: false }
      - { label: Author role, name: authorRole, widget: string, default: "Strategist and builder, Wayne Omni", required: false }
      - { label: Draft (hide from the live site), name: draft, widget: boolean, default: false, hint: "Switch on to keep the article hidden even after it is published." }
      - { label: SEO title, name: seoTitle, widget: string, required: false, hint: "Shown in Google results. Aim for 50–60 characters. Leave empty to use the page title." }
      - { label: SEO description, name: seoDescription, widget: text, required: false, hint: "Leave empty to use the excerpt. Aim for 140–160 characters." }
      - { label: Body, name: body, widget: markdown }
